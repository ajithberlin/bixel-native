[workspace]
resolver = "2"
members = [
    "crates/bixel-core",
    "crates/bixel-ffi",
    "crates/bixel-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomalyco/langtown"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
